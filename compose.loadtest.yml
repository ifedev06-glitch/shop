services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopsecure_loadtest
      POSTGRES_USER: shopsecure_loadtest
      POSTGRES_PASSWORD: shopsecure_loadtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsecure_loadtest -d shopsecure_loadtest"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - shopsecure-loadtest-data:/var/lib/postgresql/data
    networks:
      - loadtest

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      LOADTEST_DB_URL: jdbc:postgresql://database:5432/shopsecure_loadtest
      LOADTEST_DB_USERNAME: shopsecure_loadtest
      LOADTEST_DB_PASSWORD: shopsecure_loadtest
      LOADTEST_APP_BASE_URL: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - loadtest

volumes:
  shopsecure-loadtest-data:

networks:
  loadtest:
