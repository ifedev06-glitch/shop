spring.application.name=shopsecure
server.port=${PORT:8080}


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

app.base-url=${APP_BASE_URL}
app.frontend-base-url=${FRONTEND_BASE_URL}
app.data-encryption-key=${DATA_ENCRYPTION_KEY}
order.guest-token-ttl=${ORDER_GUEST_TOKEN_TTL:PT168H}
order.tracking-token-ttl=${ORDER_TRACKING_TOKEN_TTL:P180D}
wallet.withdrawal.reconciliation.initial-delay-ms=${WITHDRAWAL_RECONCILIATION_INITIAL_DELAY_MS:60000}
wallet.withdrawal.reconciliation.delay-ms=${WITHDRAWAL_RECONCILIATION_DELAY_MS:60000}
wallet.withdrawal.reconciliation.batch-size=${WITHDRAWAL_RECONCILIATION_BATCH_SIZE:50}
wallet.withdrawal.max-dispatch-attempts=${WITHDRAWAL_MAX_DISPATCH_ATTEMPTS:3}

shipping.terminal-africa.enabled=${TERMINAL_AFRICA_ENABLED:true}
shipping.terminal-africa.base-url=${TERMINAL_AFRICA_BASE_URL:https://api.terminal.africa/v1}
shipping.terminal-africa.secret-key=${TERMINAL_AFRICA_SECRET_KEY}
shipping.chowdeck.hard-disabled=${CHOWDECK_HARD_DISABLED:true}
shipping.chowdeck.base-url=${CHOWDECK_BASE_URL:https://api.chowdeck.com}
shipping.chowdeck.secret-key=${CHOWDECK_SECRET_KEY:}
shipping.chowdeck.quote-ttl=${CHOWDECK_QUOTE_TTL:PT5M}
shipping.pricing.currency=NGN
shipping.pricing.delivery-markup=${SHIPPING_DELIVERY_MARKUP:1000.00}
shipping.pricing.service-fee=${SHIPPING_SERVICE_FEE:500.00}
shipping.quote-ttl=${SHIPPING_QUOTE_TTL:PT15M}

sms.twilio.enabled=${TWILIO_SMS_ENABLED:true}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN}
sms.twilio.from-number=${TWILIO_FROM_NUMBER}
sms.twilio.base-url=${TWILIO_BASE_URL:https://api.twilio.com}

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.virtual-account-bank=${PAYSTACK_VIRTUAL_ACCOUNT_BANK:}
resend.api.key=${RESEND_API_KEY}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
