spring.application.name=shopsecure


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

app.base-url=${APP_BASE_URL}
shipping.webhook-secret=${SHIPPING_WEBHOOK_SECRET}

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.virtual-account-bank=${PAYSTACK_VIRTUAL_ACCOUNT_BANK:}
resend.api.key=${RESEND_API_KEY}
whatsapp.bot.url=${WHATSAPP_BOT_URL}
whatsapp.bot.secret=${WHATSAPP_BOT_SECRET}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
