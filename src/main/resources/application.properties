spring.application.name=shopsecure

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.base-url=${APP_BASE_URL:http://localhost:8080}
shipping.webhook-secret=${SHIPPING_WEBHOOK_SECRET}

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.virtual-account-bank=${PAYSTACK_VIRTUAL_ACCOUNT_BANK:}
resend.api.key=${RESEND_API_KEY}
whatsapp.bot.url=${WHATSAPP_BOT_URL}
whatsapp.bot.secret=${WHATSAPP_BOT_SECRET}
