spring.application.name=shopsecure
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.data-encryption-key=${DATA_ENCRYPTION_KEY}
order.guest-token-ttl=${ORDER_GUEST_TOKEN_TTL:PT168H}
order.tracking-token-ttl=${ORDER_TRACKING_TOKEN_TTL:P180D}
order.tracking-notification.initial-delay-ms=${ORDER_TRACKING_NOTIFICATION_INITIAL_DELAY_MS:60000}
order.tracking-notification.delay-ms=${ORDER_TRACKING_NOTIFICATION_DELAY_MS:60000}
order.tracking-notification.batch-size=${ORDER_TRACKING_NOTIFICATION_BATCH_SIZE:25}
order.tracking-notification.max-attempts=${ORDER_TRACKING_NOTIFICATION_MAX_ATTEMPTS:5}
order.tracking-notification.retry-delay=${ORDER_TRACKING_NOTIFICATION_RETRY_DELAY:PT5M}
order.dispute-notification.initial-delay-ms=${ORDER_DISPUTE_NOTIFICATION_INITIAL_DELAY_MS:60000}
order.dispute-notification.delay-ms=${ORDER_DISPUTE_NOTIFICATION_DELAY_MS:60000}
order.dispute-notification.batch-size=${ORDER_DISPUTE_NOTIFICATION_BATCH_SIZE:25}
order.dispute-notification.max-attempts=${ORDER_DISPUTE_NOTIFICATION_MAX_ATTEMPTS:5}
order.dispute-notification.retry-delay=${ORDER_DISPUTE_NOTIFICATION_RETRY_DELAY:PT5M}
payment.checkout.recheck-after=${PAYMENT_CHECKOUT_RECHECK_AFTER:PT15M}
payout.reconciliation.initial-delay-ms=${PAYOUT_RECONCILIATION_INITIAL_DELAY_MS:60000}
payout.reconciliation.delay-ms=${PAYOUT_RECONCILIATION_DELAY_MS:60000}
payout.reconciliation.batch-size=${PAYOUT_RECONCILIATION_BATCH_SIZE:50}
payout.reconciliation.retry-delay=${PAYOUT_RECONCILIATION_RETRY_DELAY:PT1M}
wallet.withdrawal.reconciliation.initial-delay-ms=${WITHDRAWAL_RECONCILIATION_INITIAL_DELAY_MS:60000}
wallet.withdrawal.reconciliation.delay-ms=${WITHDRAWAL_RECONCILIATION_DELAY_MS:60000}
wallet.withdrawal.reconciliation.batch-size=${WITHDRAWAL_RECONCILIATION_BATCH_SIZE:50}
wallet.withdrawal.max-dispatch-attempts=${WITHDRAWAL_MAX_DISPATCH_ATTEMPTS:3}
shipping.booking-reconciliation.initial-delay-ms=${SHIPPING_RECONCILIATION_INITIAL_DELAY_MS:60000}
shipping.booking-reconciliation.delay-ms=${SHIPPING_RECONCILIATION_DELAY_MS:60000}
shipping.booking-reconciliation.batch-size=${SHIPPING_RECONCILIATION_BATCH_SIZE:25}
shipping.booking-reconciliation.max-attempts=${SHIPPING_MAX_BOOKING_ATTEMPTS:5}
shipping.booking-reconciliation.retry-delay=${SHIPPING_BOOKING_RETRY_DELAY:PT5M}
waybill.booking-reconciliation.initial-delay-ms=${WAYBILL_BOOKING_RECONCILIATION_INITIAL_DELAY_MS:60000}
waybill.booking-reconciliation.delay-ms=${WAYBILL_BOOKING_RECONCILIATION_DELAY_MS:60000}
waybill.booking-reconciliation.batch-size=${WAYBILL_BOOKING_RECONCILIATION_BATCH_SIZE:25}
waybill.booking-reconciliation.max-attempts=${WAYBILL_MAX_BOOKING_ATTEMPTS:5}
waybill.booking-reconciliation.retry-delay=${WAYBILL_BOOKING_RETRY_DELAY:PT5M}
waybill.cancellation-reconciliation.initial-delay-ms=${WAYBILL_CANCELLATION_RECONCILIATION_INITIAL_DELAY_MS:60000}
waybill.cancellation-reconciliation.delay-ms=${WAYBILL_CANCELLATION_RECONCILIATION_DELAY_MS:60000}
waybill.cancellation-reconciliation.batch-size=${WAYBILL_CANCELLATION_RECONCILIATION_BATCH_SIZE:25}
waybill.cancellation-reconciliation.max-attempts=${WAYBILL_MAX_CANCELLATION_ATTEMPTS:5}
waybill.cancellation-reconciliation.retry-delay=${WAYBILL_CANCELLATION_RETRY_DELAY:PT5M}
waybill.payment-reconciliation.initial-delay-ms=${WAYBILL_PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:60000}
waybill.payment-reconciliation.delay-ms=${WAYBILL_PAYMENT_RECONCILIATION_DELAY_MS:60000}
waybill.payment-reconciliation.batch-size=${WAYBILL_PAYMENT_RECONCILIATION_BATCH_SIZE:50}
waybill.payment-reconciliation.retry-delay=${WAYBILL_PAYMENT_RECONCILIATION_RETRY_DELAY:PT5M}
waybill.refund-reconciliation.initial-delay-ms=${WAYBILL_REFUND_RECONCILIATION_INITIAL_DELAY_MS:60000}
waybill.refund-reconciliation.delay-ms=${WAYBILL_REFUND_RECONCILIATION_DELAY_MS:60000}
waybill.refund-reconciliation.batch-size=${WAYBILL_REFUND_RECONCILIATION_BATCH_SIZE:25}
waybill.refund-reconciliation.retry-delay=${WAYBILL_REFUND_RECONCILIATION_RETRY_DELAY:PT5M}
waybill.refund-reconciliation.unknown-timeout=${WAYBILL_REFUND_UNKNOWN_TIMEOUT:PT1H}
waybill.notification.initial-delay-ms=${WAYBILL_NOTIFICATION_INITIAL_DELAY_MS:60000}
waybill.notification.delay-ms=${WAYBILL_NOTIFICATION_DELAY_MS:60000}
waybill.notification.batch-size=${WAYBILL_NOTIFICATION_BATCH_SIZE:25}
waybill.notification.max-attempts=${WAYBILL_NOTIFICATION_MAX_ATTEMPTS:5}
waybill.notification.retry-delay=${WAYBILL_NOTIFICATION_RETRY_DELAY:PT5M}
waybill.invitation-ttl=${WAYBILL_INVITATION_TTL:PT168H}
waybill.otp.max-sends=${WAYBILL_OTP_MAX_SENDS:5}
waybill.otp.max-failed-attempts=${WAYBILL_OTP_MAX_FAILED_ATTEMPTS:10}
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}

shipping.terminal-africa.enabled=${TERMINAL_AFRICA_ENABLED:false}
shipping.terminal-africa.base-url=${TERMINAL_AFRICA_BASE_URL:https://api.terminal.africa/v1}
shipping.terminal-africa.secret-key=${TERMINAL_AFRICA_SECRET_KEY:}
shipping.chowdeck.hard-disabled=${CHOWDECK_HARD_DISABLED:true}
shipping.chowdeck.base-url=${CHOWDECK_BASE_URL:https://api.chowdeck.com}
shipping.chowdeck.secret-key=${CHOWDECK_SECRET_KEY:}
shipping.chowdeck.quote-ttl=${CHOWDECK_QUOTE_TTL:PT5M}
shipping.stub.webhook-secret=${SHIPPING_STUB_WEBHOOK_SECRET:local-shipping-webhook-secret}
shipping.pricing.currency=NGN
shipping.pricing.delivery-markup=${SHIPPING_DELIVERY_MARKUP:1000.00}
shipping.pricing.service-fee=${SHIPPING_SERVICE_FEE:500.00}
shipping.quote-ttl=${SHIPPING_QUOTE_TTL:PT15M}

sms.twilio.enabled=${TWILIO_SMS_ENABLED:false}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
sms.twilio.base-url=${TWILIO_BASE_URL:https://api.twilio.com}

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.virtual-account-bank=${PAYSTACK_VIRTUAL_ACCOUNT_BANK:}
resend.api.key=${RESEND_API_KEY}
